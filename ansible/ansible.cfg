[defaults]
inventory = ./gcp_compute_inventory.yml
private_key_file = /mnt/workspace/id_rsa_ansible
host_key_checking = False
retry_files_enabled = False
remote_user = ansible
timeout = 60

[inventory]
enable_plugins = google.cloud.gcp_compute

[ssh_connection]
# IAP tunnel via gcloud (configured via ANSIBLE_SSH_COMMON_ARGS env var in hook)
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
