[defaults]
inventory = ./gcp_compute_inventory.yml
private_key_file = /mnt/workspace/id_rsa_ansible
host_key_checking = False
retry_files_enabled = False
remote_user = ansible

[inventory]
enable_plugins = google.cloud.gcp_compute

[ssh_connection]
# Use IAP tunnel for SSH access (no external IP required)
ssh_args = -o ProxyCommand="gcloud compute start-iap-tunnel %h 22 --listen-on-stdin --zone=us-central1-a --project=$(echo $GCP_PROJECT)" -o StrictHostKeyChecking=no
pipelining = True
