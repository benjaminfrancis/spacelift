# GCP Compute Engine dynamic inventory for Ansible
# Uses IAP tunneling for SSH (no external IP required)
plugin: google.cloud.gcp_compute
projects:
  - "{{ lookup('env', 'GCP_PROJECT') }}"
zones:
  - us-central1-a
filters:
  - labels.managed_by = ansible
  - status = RUNNING
auth_kind: serviceaccount
service_account_file: "{{ lookup('env', 'GOOGLE_APPLICATION_CREDENTIALS') }}"
hostnames:
  # Use instance name for IAP tunneling
  - name
compose:
  # IAP uses instance name, not IP
  ansible_host: name
